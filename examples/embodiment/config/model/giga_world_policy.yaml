model_type: "giga_world_policy"

# In RLinf rollout, model_path is treated as the WA transformer checkpoint path.
model_path: "/path/to/wa_transformer_ckpt"

precision: bf16

num_action_chunks: 12
action_dim: 14

is_lora: False
lora_rank: 32

use_proprio: True
num_steps: 1
add_value_head: False

giga_world_policy:
  wa_root: "/path/to/wan-casual-cj"
  base_model_dir: "/path/to/Wan2.2-TI2V-5B-Diffusers"
  norm_json: "/path/to/norm_stats_delta.json"
  diffusers_src: null
  robotype: "aloha"
  num_inference_steps: 10
  guidance_scale: 0.0
  num_frames: 5
  single_view_width: 256
  single_view_height: 192
  prompt: null
  use_safetensors: False
  wa_num_action_chunks: 48

  # route A: keep frozen WA backbone + latent compressor + small RL heads
  use_rl_head_for_rollout: False

  # Feature-extractor / fusion branch for ablation:
  #   cross_attention: ours, full WA/VAE visual tokens + action-conditioned cross attention
  #   rlt_like:       RL-Token-like baseline, one 2048-dim bottleneck token + pure flat MLP actor-critic
  #   concat_mlp:     legacy CNN/concat MLP baseline
  # feature_extractor is the preferred key; fusion_mode is kept as a backward-compatible alias.
  feature_extractor: "cross_attention"
  fusion_mode: ${.feature_extractor}

  visual_feature_dim: 2048
  # Internal visual-token dim before the RLT encoder. In rlt_like mode, actor/critic
  # consume the 2048-dim RL token directly; they do not project it back to this dim.
  cross_attention_dim: 512
  cross_attention_heads: 8
  cross_attention_dropout: 0.0
  cross_attention_time_reduce: "mean"
  max_visual_tokens: 1024

  # RL-token-like baseline settings.
  # Stage 1: set feature_extractor=rlt_like and rlt_freeze_tokenizer=False, train the
  #          autoencoder objective exposed by mode="rlt_autoencoder".
  # Stage 2: resume that checkpoint, keep feature_extractor=rlt_like, and set
  #          rlt_freeze_tokenizer=True so only actor/critic heads are updated.
  rlt_num_tokens: 1
  rlt_token_dim: 2048
  rlt_freeze_tokenizer: False
  rlt_freeze_visual_adapter: True
  bc_coef: 1.0
  ref_action_dropout_p: 0.5
  target_tau: 0.005
  enable_critic_q_upper_bound: True
  critic_q_upper_bound: 100.0
  actor_q_loss_clamp_to_upper_bound: True
  critic_target_clamp_to_upper_bound: True
  critic_overshoot_penalty_coef: 1.0

  # Debug / ablation knobs for BC-copy diagnosis:
  #   actor_output_mode:
  #     - learned: use the MLP actor head (default)
  #     - hard_copy_ref_action: bypass the MLP and output ref_action directly
  #   *_input_mode (for visual / robot_state / ref_action):
  #     - normal: keep this input branch (default)
  #     - zero: keep the same input shape but replace this branch with zeros
  #     - remove: completely remove this branch from the actor/critic input
  actor_output_mode: "learned"
  visual_input_mode: "normal"
  robot_state_input_mode: "normal"
  ref_action_input_mode: "normal"
  enable_latent_debug: False
  latent_debug_dir: "./results/latent_debug"
