defaults:
  - env/realworld_piper_gigawa@env.train
  - env/realworld_piper_gigawa@env.eval
  - model/giga_world_policy@actor.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0
    rollout: 0
    env:
      node_group: node
      placement: 0

runner:
  task_type: embodied
  logger:
    log_path: "/home/ubuntu/users/angen.ye/gwp/RLinf/examples/results/offline_rl_piper_success100_failure100_7"
    project_name: rlinf
    experiment_name: "piper_success100_failure100_7_offline_rl"
    logger_backends: ["tensorboard"]

  # One epoch internally contains offline_bc_pretrain.steps_per_epoch actor updates.
  max_epochs: 600
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 50

  resume_dir: null
  ckpt_path: "/home/ubuntu/users/angen.ye/gwp/RLinf/examples/results/offline_piper_actor_bc_kwj/piper_lerobot_actor_bc_warmup/checkpoints/global_step_600/actor/model_state_dict/full_weights.pt"
  resume_load_optimizer_and_scheduler_state: false
  per_worker_log_path: null

algorithm:
  replay_buffer:
    enable_cache: false
    cache_size: 1
    sample_window_size: 1
    min_buffer_size: 0
    require_for_training: false
    store_online_data: false
    auto_save: false
    auto_save_path: null
    trajectory_format: pt
    enable_preload: false
    prefetch_size: 1

  demo_buffer:
    enable: true
    enable_cache: false
    cache_size: 1
    sample_window_size: 1
    min_buffer_size: 2
    train_actor_steps: 32
    auto_save: false
    auto_save_path: null
    trajectory_format: pt
    load_path:
      - /home/ubuntu/users/angen.ye/gwp/RLinf/examples/results/collect_piper_gigawa_success100_failure100_7/offline_collection/rank_0/all
    sample_ratio: 1.0
    allow_train_on_demo_only: true
    allow_demo_only_fallback: true
    allow_replay_only_fallback: false
    store_online_interventions: false

  offline_rl_pretrain:
    enable: true
    val_ratio: 0.1
    split_seed: 1234
    quality_mode: reward_max
    success_threshold: 0.5
    steps_per_epoch: 60
    val_steps_per_epoch: 12
    class_eval_steps_per_epoch: 12
    val_interval: 50
    class_eval_interval: 50
    tb_flush_interval: 10
    critic_updates_per_step: 2
    actor_updates_per_step: 1

  normalize_advantages: false
  kl_penalty: kl
  group_size: 1

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: gae
  loss_type: embodied_gigawa
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.82
  gae_lambda: 0.95

  reward_coef: 1
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 5.0

  # BC+TD3 离线RL，actor 和 critic 都训练。
  training_stage: full_rl
  actor_bc_target: batch_action
  use_action_valid_mask: true

  update_epoch: 1
  utd_ratio: 1
  critic_actor_ratio: 2
  tau: 0.005
  target_update_freq: 1
  target_policy_noise: 0.0
  target_noise_clip: 0.0

  # 纯 BC warmup 建议先用 1.0，避免梯度尺度过大。
  # 如果 train/val BC 下降很慢，可以后面改成 10 或 50。
  bc_coef: 50
  ref_action_dropout_p: 0

  warmup_steps: 0
  train_actor_steps: 0
  rollout_actor_after_warmup: false
  rollout_actor_min_actor_updates: 100000000

  freeze_critic_updates: false
  freeze_actor_updates: false
  freeze_visual_layers: false

  # LeRobot 已经被转换成 12-step chunk buffer，这里不再做额外 sliding-window 增广。
  gigawa_sliding_window:
    enable: false
    offset_stride: 12
    max_offsets: 1
    augment_mode: preserve_ref_action

  sampling_params:
    do_sample: false
    temperature_train: -1
    temperature_eval: -1
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 512
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: false

  train:
    total_num_envs: 1
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 960
    max_steps_per_rollout_epoch: 960
    group_size: 1
    auto_reset: false
    ignore_terminations: false
    override_cfg:
      is_dummy: true
      joint_action_mode: absolute
      enable_human_intervention: false
      camera_names:
        - cam_high
        - cam_left_wrist
        - cam_right_wrist
      img_topics:
        - /camera_f/color/image_raw
        - /camera_l/color/image_raw
        - /camera_r/color/image_raw
      obs_img_resolution: [480, 640]

  eval:
    total_num_envs: 1
    auto_reset: false
    ignore_terminations: false
    max_episode_steps: 960
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 960
    group_size: 1
    use_fixed_reset_state_ids: false
    override_cfg:
      is_dummy: true
      joint_action_mode: absolute
      enable_human_intervention: false
      camera_names:
        - cam_high
        - cam_left_wrist
        - cam_right_wrist
      img_topics:
        - /camera_f/color/image_raw
        - /camera_l/color/image_raw
        - /camera_r/color/image_raw
      obs_img_resolution: [480, 640]
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 64
  seed: 1234
  enable_offload: false

  recv_queue_maxsize: 4
  recv_drain_max_trajectories: 16
  sync_weight_no_wait: false

  critic_optim:
    lr: 3.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 16000
    lr_warmup_steps: 0
    lr_scheduler: constant
    num_cycles: 0.5
    min_lr: 2.5e-06

  model:
    model_path: "/home/ubuntu/users/angen.ye/gwp/checkpoints/checkpoint_epoch_72_step_60000/transformer"
    num_action_chunks: 12
    action_dim: 14
    precision: bf16
    giga_world_policy:
      wa_root: "/home/ubuntu/users/angen.ye/gwp/wan-casual-cj"
      base_model_dir: "/home/ubuntu/users/angen.ye/gwp/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers"
      norm_json: "/home/ubuntu/users/angen.ye/gwp/rollout1/norm_stats_delta.json"
      diffusers_src: null
      robotype: "aloha"
      actor_robot_state_mode: normalized
      keep_raw_robot_state: true
      num_inference_steps: 10
      guidance_scale: 0.0
      num_frames: 5
      single_view_width: 256
      single_view_height: 192
      prompt: null
      prompt_embeds_path: "/home/ubuntu/users/angen.ye/gwp/T5/episode_000000.pt"
      prompt_embeds_max_length: 64
      use_safetensors: false
      use_rl_head_for_rollout: false
      visual_feature_dim: 2048
      bc_coef: 50
      ref_action_dropout_p: 0
      target_tau: 0.005
      enable_latent_debug: false
      latent_debug_dir: "${runner.logger.log_path}/latent_debug"
      actor_output_mode: "learned"
      visual_input_mode: "normal"
      robot_state_input_mode: "normal"
      ref_action_input_mode: "normal"
      wa_num_action_chunks: 48

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 16000
    lr_warmup_steps: 0
    lr_scheduler: constant
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
