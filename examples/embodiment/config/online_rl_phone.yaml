defaults:
  - env/robotwin_place_empty_cup@env.train
  - env/robotwin_place_empty_cup@env.eval
  - model/giga_world_policy@actor.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    # actor: 0
    # rollout: 1-2
    # env: "3:0-1"
    actor: 0
    rollout: 1
    env: 1

runner:
  task_type: embodied
  logger:
    log_path:  "/shared_disk/users/angen.ye/code/world_module_rollout/RLinf/examples/results/online_rl_cup_517_final_test"
    project_name: rlinf
    experiment_name: "robotwin_train_giga_world_policy"
    logger_backends: ["tensorboard"]

  max_epochs: 20000 #test
  max_steps: -1

  # When true, train_embodied_agent_gigawa.py uses AsyncEmbodiedRunner,
  # AsyncEnvWorker, AsyncMultiStepRolloutWorker, and AsyncEmbodiedGigaWAFSDPPolicy.
  # Rollout collection runs continuously while actor/critic training consumes
  # newly collected trajectories from the replay buffer.
  async_rollout_training: true
  async_disable_inline_eval: true
  replay_channel_maxsize: 4
  weight_sync_interval: 20

  only_eval: False
  val_check_interval: 200
  save_interval: 200

  resume_dir: /shared_disk/users/angen.ye/code/world_module_rollout/RLinf/examples/results/online_rl_cup_517_final_test/robotwin_train_giga_world_policy/checkpoints/global_step_200
  ckpt_path: null
  resume_load_optimizer_and_scheduler_state: true

algorithm:
  replay_buffer:
    enable_cache: True
    cache_size: 2000
    sample_window_size: 8000
    min_buffer_size: 16
    auto_save: False
    auto_save_path: null
    trajectory_format: pt
    enable_preload: False
    prefetch_size: 10

  demo_buffer:
    enable: True
    enable_cache: True
    cache_size: 2000
    sample_window_size: 6000
    min_buffer_size: 0
    train_actor_steps: 2
    auto_save: False
    auto_save_path: null
    trajectory_format: pt
    load_path: null
    sample_ratio: 0
    allow_train_on_demo_only: true
    allow_demo_only_fallback: true
    allow_replay_only_fallback: false
    store_online_interventions: false

  normalize_advantages: False
  kl_penalty: kl
  group_size: 1

  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: gae
  loss_type: embodied_gigawa
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.9836
  gae_lambda: 0.95

  reward_coef: 1 #test
  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 5.0

  training_stage: full_rl # bc_actor_pretrain / critic_warmup / full_rl

  update_epoch: 1
  utd_ratio: 5 #test
  # Must be >= replay_buffer.min_buffer_size for the initial async warmup if
  # staleness is active.  The rollout code also bypasses staleness during
  # WA-only warmup to avoid deadlock.
  staleness_threshold: 2
  critic_actor_ratio: 2
  tau: 0.005
  target_update_freq: 1
  target_policy_noise: 0.0
  target_noise_clip: 0.0
  bc_coef: 50
  ref_action_dropout_p: 0
  warmup_steps: 16
  train_actor_steps: 0
  rollout_actor_after_warmup: true
  rollout_actor_min_actor_updates: 500

  freeze_critic_updates: false
  freeze_actor_updates: false
  freeze_visual_layers: false

  actor_bc_guard:
    mode: none
    # threshold: 0.004
    # weighted_bc_coef: 50.0

  sampling_params:
    do_sample: False
    temperature_train: -1
    temperature_eval: -1
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 512
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    total_num_envs: 2
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 192
    max_steps_per_rollout_epoch: 192
    group_size: 1
    auto_reset: False
    ignore_terminations: False
    assets_path: "/shared_disk/users/angen.ye/code/world_module_rollout/RoboTwin-RLinf_support"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/train_seeds.json
    center_crop: False
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true


  eval:
    total_num_envs: 2
    auto_reset: True
    ignore_terminations: False
    max_episode_steps: 192
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 192
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: "/shared_disk/users/angen.ye/code/world_module_rollout/RoboTwin-RLinf_support"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/robotwin/seeds/eval_seeds.json
    center_crop: False
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true


rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 64
  seed: 1234
  enable_offload: False

  # Async GigaWA rollout receiver.  The queue is intentionally bounded so the
  # rollout side is back-pressured instead of accumulating unlimited trajectories.
  recv_queue_maxsize: 4
  recv_drain_max_trajectories: 16
  sync_weight_no_wait: false
  async_skip_sleep_s: 1
  async_skip_log_interval_s: 30.0

  critic_optim:
    lr: 3.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 200
    lr_warmup_steps: 0
    lr_scheduler: constant
    num_cycles: 0.5
    min_lr: 2.5e-06

  model:
    model_path: "/shared_disk/users/angen.ye/code/world_module_rollout/checkpoints/checkpoint_epoch_2_step_100000/transformer"
    num_action_chunks: 12
    action_dim: 14
    precision: bf16
    giga_world_policy:
      wa_root: "/shared_disk/users/angen.ye/code/world_module_rollout/wan-casual-cj"
      base_model_dir: "/shared_disk/models/huggingface/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers"
      norm_json: "/shared_disk/users/angen.ye/code/world_module_rollout/norm_stats_delta.json"
      diffusers_src: null
      robotype: "aloha"
      num_inference_steps: 10
      guidance_scale: 0.0
      num_frames: 5
      single_view_width: 256
      single_view_height: 192
      prompt: null
      use_safetensors: False
      use_rl_head_for_rollout: false
      visual_feature_dim: 2048
      bc_coef: 50
      ref_action_dropout_p: 0
      target_tau: 0.005
      enable_latent_debug: False
      latent_debug_dir: "${runner.logger.log_path}/latent_debug"
      actor_output_mode: "learned"
      visual_input_mode: "normal"
      robot_state_input_mode: "normal"
      ref_action_input_mode: "normal"
      wa_num_action_chunks: 48

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 200
    lr_warmup_steps: 0
    lr_scheduler: "constant"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: true
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
